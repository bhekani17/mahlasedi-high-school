<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Mahlasedi High School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#001F3F',
            secondary: '#4DA6D6',
            accent: '#87CEEB',
            success: '#10B981',
            warning: '#F59E0B',
            danger: '#EF4444',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .login-bg {
      background: linear-gradient(135deg, #001F3F 0%, #4DA6D6 100%);
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .input-focus {
      transition: all 0.3s ease;
    }
    .input-focus:focus {
      border-color: #4DA6D6;
      box-shadow: 0 0 0 3px rgba(77, 166, 214, 0.1);
    }
  </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">
  <!-- Background Pattern -->
  <div class="absolute inset-0 opacity-10">
    <div class="absolute inset-0" style="background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23ffffff" fill-opacity="0.4"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
  </div>

  <!-- Login Container -->
  <div class="relative w-full max-w-md">
    <!-- Logo and Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-full shadow-lg mb-4">
        <img src="../static/images/logo.png" alt="Mahlasedi Logo" class="h-16 w-auto">
      </div>
      <h1 class="text-3xl font-bold text-white mb-2">Mahlasedi High School</h1>
      <p class="text-blue-200">Admin Portal Login</p>
    </div>

    <!-- Login Form -->
    <div class="glass-effect rounded-2xl shadow-2xl p-8">
      <form id="loginForm" class="space-y-6">
        <!-- Error/Success Messages -->
        <div id="messageContainer" class="hidden">
          <div id="message" class="p-4 rounded-lg text-sm"></div>
        </div>

        <!-- Username/Email -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-user mr-2"></i>Username or Email
          </label>
          <input
            type="text"
            id="username"
            name="username"
            required
            class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none"
            placeholder="Enter your username or email"
          >
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            <i class="fas fa-lock mr-2"></i>Password
          </label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              required
              class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none pr-12"
              placeholder="Enter your password"
            >
            <button
              type="button"
              id="togglePassword"
              class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
            >
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary">
            <span class="ml-2 text-sm text-gray-600">Remember me</span>
          </label>
          <a href="#" class="text-sm text-primary hover:text-blue-800">Forgot password?</a>
        </div>

        <!-- Login Button -->
        <button
          type="submit"
          class="w-full bg-primary text-white py-3 px-4 rounded-lg font-semibold hover:bg-blue-800 transition duration-200 flex items-center justify-center"
        >
          <i class="fas fa-sign-in-alt mr-2"></i>
          Sign In
        </button>

        <!-- Additional Options -->
        <div class="text-center space-y-4">
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-white text-gray-500">Or continue with</span>
            </div>
          </div>

          <!-- Quick Access Links -->
          <div class="grid grid-cols-2 gap-3">
            <button
              type="button"
              onclick="quickLogin('admin')"
              class="bg-gray-100 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-200 transition text-sm"
            >
              <i class="fas fa-user-shield mr-1"></i>
              Admin Demo
            </button>
            <button
              type="button"
              onclick="quickLogin('teacher')"
              class="bg-gray-100 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-200 transition text-sm"
            >
              <i class="fas fa-chalkboard-teacher mr-1"></i>
              Teacher Demo
            </button>
          </div>
        </div>
      </form>

      <!-- Security Notice -->
      <div class="mt-6 p-4 bg-blue-50 rounded-lg">
        <div class="flex items-start">
          <i class="fas fa-shield-alt text-blue-600 mt-0.5 mr-2"></i>
          <div class="text-xs text-blue-800">
            <p class="font-semibold mb-1">Security Notice</p>
            <p>This is a secure administrative portal. Unauthorized access is prohibited and will be logged.</p>
          </div>
        </div>
      </div>

      <!-- Footer Links -->
      <div class="mt-6 text-center text-xs text-gray-500">
        <p>© 2024 Mahlasedi High School. All rights reserved.</p>
        <div class="mt-2 space-x-4">
          <a href="../index.html" class="hover:text-primary">Back to Website</a>
          <span>|</span>
          <a href="#" class="hover:text-primary">Help</a>
          <span>|</span>
          <a href="#" class="hover:text-primary">Privacy Policy</a>
        </div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white rounded-lg p-6 flex items-center space-x-3">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
        <span class="text-gray-700">Signing in...</span>
      </div>
    </div>
  </div>

  <script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    });

    // Show message function
    function showMessage(message, type = 'error') {
      const messageContainer = document.getElementById('messageContainer');
      const messageDiv = document.getElementById('message');
      
      messageContainer.classList.remove('hidden');
      messageDiv.textContent = message;
      
      // Remove existing classes
      messageDiv.classList.remove('bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-yellow-100', 'text-yellow-700');
      
      // Add appropriate classes based on type
      if (type === 'error') {
        messageDiv.classList.add('bg-red-100', 'text-red-700');
      } else if (type === 'success') {
        messageDiv.classList.add('bg-green-100', 'text-green-700');
      } else if (type === 'warning') {
        messageDiv.classList.add('bg-yellow-100', 'text-yellow-700');
      }
      
      // Auto-hide after 5 seconds
      setTimeout(() => {
        messageContainer.classList.add('hidden');
      }, 5000);
    }

    // Show/hide loading overlay
    function toggleLoading(show) {
      const loadingOverlay = document.getElementById('loadingOverlay');
      if (show) {
        loadingOverlay.classList.remove('hidden');
      } else {
        loadingOverlay.classList.add('hidden');
      }
    }

    // Quick login demo
    function quickLogin(role) {
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      
      if (role === 'admin') {
        usernameInput.value = 'admin';
        passwordInput.value = 'admin123';
        showMessage('Admin credentials filled. Click Sign In to continue.', 'warning');
      } else if (role === 'teacher') {
        usernameInput.value = 'teacher';
        passwordInput.value = 'teacher123';
        showMessage('Teacher credentials filled. Click Sign In to continue.', 'warning');
      }
    }

    // Form submission
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      // Clear any existing messages
      document.getElementById('messageContainer').classList.add('hidden');
      
      // Show loading
      toggleLoading(true);
      
      // Simulate authentication (in real app, this would be an API call)
      setTimeout(() => {
        toggleLoading(false);
        
        // Demo authentication logic
        if (username === 'admin' && password === 'admin123') {
          showMessage('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else if (username === 'teacher' && password === 'teacher123') {
          showMessage('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else if (username === '' || password === '') {
          showMessage('Please enter both username and password.', 'error');
        } else {
          showMessage('Invalid credentials. Please try again.', 'error');
        }
      }, 1500);
    });

    // Input validation feedback
    document.getElementById('username').addEventListener('input', function() {
      if (this.value.length > 0) {
        this.classList.remove('border-red-300');
        this.classList.add('border-gray-300');
      }
    });

    document.getElementById('password').addEventListener('input', function() {
      if (this.value.length > 0) {
        this.classList.remove('border-red-300');
        this.classList.add('border-gray-300');
      }
    });

    // Enter key handling
    document.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('loginForm').dispatchEvent(new Event('submit'));
      }
    });

    // Forgot password handler
    document.querySelector('a[href="#"]').addEventListener('click', function(e) {
      if (this.textContent.includes('Forgot password')) {
        e.preventDefault();
        showMessage('Password reset functionality would be implemented here.', 'warning');
      }
    });
  </script>
</body>
</html>
